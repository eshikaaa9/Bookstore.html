<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - G.L. Bajaj Online Book Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>G.L. Bajaj Online Book Store</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="register.html" class="active">Register</a> |
        <a href="catalogue.html">Catalogue</a> |
        <a href="cart.html">Cart</a>
    </nav>
</header>

<div class="layout">

    <aside>
        <h3>Categories</h3>
        <button class="cat-btn">CSE Books</button>
        <button class="cat-btn">ECE Books</button>
        <button class="cat-btn">Mechanical Books</button>
    </aside>

    <main>

        <div class="panel">

            <h2>Registration Page</h2>

            <form>

                <input type="text" placeholder="Full Name">
                <input type="email" placeholder="Email">
                <input type="tel" placeholder="Mobile Number">

                <input type="password" placeholder="Password">
                <input type="password" placeholder="Confirm Password">

                <label>Sex:</label>

                <label><input type="radio" name="sex"> Male</label>
                <label><input type="radio" name="sex"> Female</label>
                <label><input type="radio" name="sex"> Other</label>

                <br><br>

                <label>Date of Birth:</label>

                <select><option>Day</option></select>
                <select><option>Month</option></select>
                <select><option>Year</option></select>

                <br><br>

                <label>Languages Known:</label>

                <label><input type="checkbox"> English</label>
                <label><input type="checkbox"> Hindi</label>
                <label><input type="checkbox"> Telugu</label>
                <label><input type="checkbox"> Tamil</label>

                <br><br>

                <textarea placeholder="Enter your Address"></textarea>

                <button class="btn-primary">Register</button>

            </form>

        </div>

    </main>

</div>

<footer>
    <div class="credit">
        @Created by ESHIKA SRIVASTAVA<br>
        Roll No. 072
    </div>
</footer>

</body>
</html>
